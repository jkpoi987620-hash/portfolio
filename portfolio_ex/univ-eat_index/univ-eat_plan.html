<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Univ-Eat — 구독 플랜 선택</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../univ-eat_css/univ-eat_transition.css" />
  <link rel="stylesheet" href="../univ-eat_css/univ-eat_plan.css" />
</head>
<body>

  <div class="phone-wrap">
    <div class="screen page-slide-in">

      <!-- 헤더 -->
      <header class="plan-header">
        <button class="plan-header__back" id="btnBack" aria-label="뒤로가기">
          <svg width="10" height="16" viewBox="0 0 10 16" fill="none">
            <polyline points="8 2 2 8 8 14" stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div class="plan-header__text">
          <h1 class="plan-header__title">구독 플랜 선택</h1>
          <p class="plan-header__sub">더 많이 구독할수록 더 많이 절약해요 💰</p>
        </div>
      </header>

      <!-- 콘텐츠 -->
      <div class="content">

        <!-- 플랜 카드 목록 -->
        <ul class="plan-list" id="planList">

          <!-- 30식 플랜 -->
          <li class="plan-card" data-plan="30" id="plan30">
            <div class="plan-card__top">
              <p class="plan-card__name">30식 플랜</p>
              <span class="plan-card__badge plan-card__badge--default">한 달 기준</span>
            </div>
            <div class="plan-card__price-row">
              <span class="plan-card__price">252,000원</span>
              <span class="plan-card__origin">420,000원</span>
              <span class="plan-card__discount">40% ↓</span>
            </div>
            <p class="plan-card__desc">🍱 점심 모두 이용 가능</p>
          </li>

          <!-- 60식 플랜 (인기) -->
          <li class="plan-card plan-card--popular" data-plan="60" id="plan60">
            <div class="plan-card__top">
              <p class="plan-card__name">60식 플랜</p>
              <span class="plan-card__badge plan-card__badge--hot">🔥 가장 인기</span>
            </div>
            <div class="plan-card__price-row">
              <span class="plan-card__price">252,000원</span>
              <span class="plan-card__origin">420,000원</span>
              <span class="plan-card__discount">40% ↓</span>
            </div>
            <p class="plan-card__desc">🍱 점심 모두 이용 가능</p>
          </li>

          <!-- 90식 플랜 -->
          <li class="plan-card" data-plan="90" id="plan90">
            <div class="plan-card__top">
              <p class="plan-card__name">90식 플랜</p>
              <span class="plan-card__badge plan-card__badge--default">한 달 기준</span>
            </div>
            <div class="plan-card__price-row">
              <span class="plan-card__price">252,000원</span>
              <span class="plan-card__origin">420,000원</span>
              <span class="plan-card__discount">40% ↓</span>
            </div>
            <p class="plan-card__desc">🍱 점심 모두 이용 가능</p>
          </li>

        </ul>

        <!-- 결제 방법 -->
        <div class="pay-section">
          <p class="pay-section__title">결제 방법 선택</p>
          <div class="pay-grid" id="payGrid">
            <button type="button" class="pay-btn" data-pay="card">💳 신용/체크카드</button>
            <button type="button" class="pay-btn" data-pay="naver">N 네이버페이</button>
            <button type="button" class="pay-btn" data-pay="kakao">K 카카오페이</button>
            <button type="button" class="pay-btn" data-pay="toss">toss 토스</button>
            <button type="button" class="pay-btn pay-btn--full" data-pay="bank">🏦 무통장입금</button>
          </div>
        </div>

        <!-- 버튼 영역 -->
        <div class="btn-area">
          <button class="btn-subscribe" id="btnSubscribe">구독하기</button>
          <button class="btn-skip" id="btnSkip">넘어가기</button>
        </div>

      </div>

    </div>
  </div>

  <script src="../univ-eat_js/univ-eat_transition.js"></script>
  <script src="../univ-eat_js/univ-eat_plan.js"></script>
</body>
</html>
