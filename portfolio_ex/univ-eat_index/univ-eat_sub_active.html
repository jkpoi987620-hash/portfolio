<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Univ-Eat — 구독 관리</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../univ-eat_css/univ-eat_transition.css" />
  <link rel="stylesheet" href="../univ-eat_css/univ-eat_sub_active.css" />
</head>
<body>

  <div class="phone-wrap">
    <div class="screen page-slide-in">

      <!-- 헤더 -->
      <header class="sub-header">
        <div class="sub-header__text">
          <h1 class="sub-header__title">구독 플랜</h1>
          <p class="sub-header__sub">현재 구독 중이에요 ✅</p>
        </div>
      </header>

      <!-- 콘텐츠 -->
      <div class="content">

        <!-- 구독 상태 카드 -->
        <div class="status-card">
          <div class="status-card__top">
            <span class="status-card__active-badge">✅ 구독 중</span>
            <span class="status-card__plan-badge">🔥 60식 플랜</span>
          </div>
          <p class="status-card__price">252,000원 <span class="status-card__price-unit">/ 월</span></p>
          <div class="status-card__divider"></div>
          <div class="status-card__row">
            <span class="status-card__label">잔여 식권</span>
            <span class="status-card__value status-card__value--blue">23개 남음</span>
          </div>
          <div class="status-card__row">
            <span class="status-card__label">다음 갱신일</span>
            <span class="status-card__value">2025.05.01</span>
          </div>
          <div class="status-card__row">
            <span class="status-card__label">이번 달 절약</span>
            <span class="status-card__value status-card__value--green">↓ ₩42,600</span>
          </div>
        </div>

        <!-- 플랜 변경 버튼 -->
        <button class="btn-change">📋&nbsp; 플랜 변경하기</button>

        <!-- 결제 내역 버튼 -->
        <button class="btn-payment">💳&nbsp; 결제 내역 보기</button>

        <!-- 구독 해지 -->
        <button class="btn-cancel">구독 해지</button>

      </div>

      <!-- 바텀 네비게이션 -->
      <nav class="bottom-nav">
        <button class="nav-item" data-nav="home">
          <span class="nav-item__icon">🏠</span>
          <span class="nav-item__label">홈</span>
        </button>
        <button class="nav-item" data-nav="meal">
          <span class="nav-item__icon">🍽️</span>
          <span class="nav-item__label">학식정보</span>
        </button>
        <button class="nav-item nav-item--active" data-nav="sub">
          <span class="nav-item__icon">🎫</span>
          <span class="nav-item__label">구독</span>
        </button>
        <button class="nav-item" data-nav="dining">
          <span class="nav-item__icon">🗺️</span>
          <span class="nav-item__label">외식정보</span>
        </button>
        <button class="nav-item" data-nav="mypage">
          <span class="nav-item__icon">👤</span>
          <span class="nav-item__label">마이페이지</span>
        </button>
      </nav>

    </div>
  </div>

  <script src="../univ-eat_js/univ-eat_transition.js"></script>
  <script src="../univ-eat_js/univ-eat_sub_active.js"></script>
</body>
</html>
