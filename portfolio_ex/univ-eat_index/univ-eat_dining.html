<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Univ-Eat — 외식정보</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="../univ-eat_css/univ-eat_transition.css" />
  <link rel="stylesheet" href="../univ-eat_css/univ-eat_dining.css" />
</head>
<body>

  <div class="phone-wrap">
    <div class="screen page-slide-in">

      <!-- 지도 영역 -->
      <div class="map-area">
        <!-- Leaflet 지도 -->
        <div id="map"></div>

        <!-- 검색바 오버레이 -->
        <div class="map-overlay-top">
          <div class="map-search__bar">
            <span class="map-search__placeholder">🔍&nbsp; 식당 이름, 메뉴 검색</span>
          </div>
          <div class="map-controls">
            <button class="map-ctrl-btn" id="mapZoomIn">+</button>
            <button class="map-ctrl-btn" id="mapZoomOut">−</button>
            <button class="map-ctrl-btn map-ctrl-btn--locate" id="mapLocate"></button>
          </div>
        </div>

        <!-- 비교 칩 오버레이 -->
        <div class="map-compare">
          <span class="map-compare__label">오늘 학식보다 저렴한 곳</span>
          <span class="map-compare__badge">3곳</span>
        </div>
      </div>

      <!-- 피드 영역 -->
      <div class="feed-area">

        <!-- 피드 헤더 -->
        <div class="feed-header">
          <p class="feed-header__title">주변 맛집 피드 📸</p>
          <div class="feed-chips" id="feedChips">
            <button class="chip chip--active" data-chip="recent">최신순</button>
            <button class="chip" data-chip="rating">평점순</button>
            <button class="chip" data-chip="distance">거리순</button>
          </div>
        </div>

        <!-- 피드 그리드 -->
        <div class="feed-grid">
          <!-- 왼쪽 열 -->
          <div class="feed-col">
            <div class="feed-card">
              <div class="feed-card__img">
                <img src="https://www.figma.com/api/mcp/asset/2abdc94f-f7b3-41ee-b74d-a70f81a047b5" alt="대박국수집" />
                <div class="feed-card__img-overlay"></div>
                <div class="feed-card__tags">
                  <span class="feed-card__price">5,500원</span>
                  <span class="feed-card__rating">⭐ 4.8</span>
                </div>
              </div>
              <div class="feed-card__info">
                <p class="feed-card__name">대박국수집</p>
                <p class="feed-card__dist">🍜 캠퍼스 정문 150m</p>
              </div>
            </div>
            <div class="feed-card">
              <div class="feed-card__img">
                <img src="https://www.figma.com/api/mcp/asset/3d84f6b9-0afd-40ec-9cc7-8970a4eca4b8" alt="샐러드데이" />
                <div class="feed-card__img-overlay"></div>
                <div class="feed-card__tags">
                  <span class="feed-card__price">7,500원</span>
                  <span class="feed-card__rating">⭐ 4.9</span>
                </div>
              </div>
              <div class="feed-card__info">
                <p class="feed-card__name">샐러드데이</p>
                <p class="feed-card__dist">🥗 220m</p>
              </div>
            </div>
          </div>

          <!-- 오른쪽 열 -->
          <div class="feed-col">
            <div class="feed-card">
              <div class="feed-card__img">
                <img src="https://www.figma.com/api/mcp/asset/1916e3cb-0906-4b2b-9838-704400d0f989" alt="치킨마루" />
                <div class="feed-card__img-overlay"></div>
                <div class="feed-card__tags">
                  <span class="feed-card__price">8,000원</span>
                  <span class="feed-card__rating">⭐ 4.6</span>
                </div>
              </div>
              <div class="feed-card__info">
                <p class="feed-card__name">치킨마루</p>
                <p class="feed-card__dist">🍗 캠퍼스 후문 80m</p>
              </div>
            </div>
            <div class="feed-card">
              <div class="feed-card__img">
                <img src="https://www.figma.com/api/mcp/asset/01a647d2-7d28-4d0a-a402-2f6563838c58" alt="인도카레하우스" />
                <div class="feed-card__img-overlay"></div>
                <div class="feed-card__tags">
                  <span class="feed-card__price">6,000원</span>
                  <span class="feed-card__rating">⭐ 4.5</span>
                </div>
              </div>
              <div class="feed-card__info">
                <p class="feed-card__name">인도카레하우스</p>
                <p class="feed-card__dist">🍛 330m</p>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- FAB: 식당 추가하기 -->
      <button class="fab-add" id="fabAdd">＋ 식당 추가하기</button>

      <!-- 바텀 네비게이션 -->
      <nav class="bottom-nav">
        <button class="nav-item" data-nav="home">
          <span class="nav-item__icon">🏠</span>
          <span class="nav-item__label">홈</span>
        </button>
        <button class="nav-item" data-nav="meal">
          <span class="nav-item__icon">🍽️</span>
          <span class="nav-item__label">학식정보</span>
        </button>
        <button class="nav-item" data-nav="sub">
          <span class="nav-item__icon">🎫</span>
          <span class="nav-item__label">구독</span>
        </button>
        <button class="nav-item nav-item--active" data-nav="dining">
          <span class="nav-item__icon">🗺️</span>
          <span class="nav-item__label">외식정보</span>
        </button>
        <button class="nav-item" data-nav="mypage">
          <span class="nav-item__icon">👤</span>
          <span class="nav-item__label">마이페이지</span>
        </button>
      </nav>

    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../univ-eat_js/univ-eat_transition.js"></script>
  <script src="../univ-eat_js/univ-eat_dining.js"></script>
</body>
</html>
